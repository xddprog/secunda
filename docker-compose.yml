x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    command: sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        
  consumer:
    <<: *backend
    command: faststream run app.consumer:app
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
